# Qlib 初始化配置
qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
# 定义市场和基准
market: &market csi300
benchmark: &benchmark SH000300
# 数据处理器配置
data_handler_config: &data_handler_config
    start_time: 2008-01-01
    end_time: 2020-08-01
    fit_start_time: 2008-01-01
    fit_end_time: 2014-12-31
    instruments: *market
    # 推理阶段的数据处理器
    infer_processors:
        # 筛选特征列
        - class: FilterCol
          kwargs:
              fields_group: feature
              # Alpha158 中的部分因子
              col_list: ["RESI5", "WVMA5", "RSQR5", "KLEN", "RSQR10", "CORR5", "CORD5", "CORR10", 
                            "ROC60", "RESI10", "VSTD5", "RSQR60", "CORR60", "WVMA60", "STD5", 
                            "RSQR20", "CORD60", "CORD10", "CORR20", "KLOW"
                        ]
        # Z-Score 标准化
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        # 填充缺失值
        - class: Fillna
          kwargs:
              fields_group: feature
    # 学习阶段的数据处理器
    learn_processors:
        # 丢弃标签为空的数据
        - class: DropnaLabel
        # 截面排序归一化
        - class: CSRankNorm
          kwargs:
              fields_group: label
    # 标签定义：未来1天的收益率
    label: ["Ref($close, -2) / Ref($close, -1) - 1"] 

# 投资组合分析配置
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2017-01-01
        end_time: 2020-08-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
# 任务配置
task:
    # 模型配置
    model:
        # 使用通用的 PyTorch 神经网络模型
        class: GeneralPTNN
        module_path: qlib.contrib.model.pytorch_general_nn
        kwargs:
            # 训练超参数，通过环境变量动态传入
            n_epochs: {{ n_epochs }}
            lr: {{ lr }}
            early_stop: {{ early_stop }}
            batch_size: {{ batch_size }}
            weight_decay: {{ weight_decay }}
            metric: loss
            loss: mse
            n_jobs: 20
            GPU: 0
            # PyTorch 模型的位置，指向外部 model.py 文件中的模型类
            pt_model_uri: "model.model_cls"
            # PyTorch 模型的参数
            pt_model_kwargs: {
                # 特征数量硬编码为 20，因为使用的是筛选后的 Alpha158 因子
                "num_features": 20,
                # 如果定义了 num_timesteps，则传入
                {% if num_timesteps %}num_timesteps: {{ num_timesteps }}{% endif %}
            }                    
    # 数据集配置
    dataset:
        # 数据集类名，通过环境变量动态传入，默认为 DatasetH
        class: {{ dataset_cls | default("DatasetH") }}
        module_path: qlib.data.dataset
        kwargs:
            handler:
                # 使用 Alpha158 因子库
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2008-01-01, 2014-12-31]
                valid: [2015-01-01, 2016-12-31]
                test: [2017-01-01, 2020-08-01]
            # 如果定义了 step_len，则传入（主要用于时序数据集）
            {% if step_len %}step_len: {{ step_len }}{% endif %}
    # 记录器配置
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
