# Qlib 初始化配置
qlib_init:
    # 数据存储路径
    provider_uri: "~/.qlib/qlib_data/cn_data"
    # 区域设置为中国
    region: cn

# 定义市场和基准的别名，方便后续引用
market: &market csi300  # 市场：沪深300
benchmark: &benchmark SH000300  # 基准：沪深300指数

# 数据处理器配置
data_handler_config: &data_handler_config
    # 数据起止时间
    start_time: 2008-01-01
    end_time: 2020-08-01
    # 训练数据起止时间
    fit_start_time: 2008-01-01
    fit_end_time: 2014-12-31
    # 股票池
    instruments: *market
    # 推理阶段的数据处理器
    infer_processors:
        # 筛选特征列
        - class: FilterCol
          kwargs:
              fields_group: feature
              # Alpha158 中的部分因子
              col_list: ["RESI5", "WVMA5", "RSQR5", "KLEN", "RSQR10", "CORR5", "CORD5", "CORR10", 
                            "ROC60", "RESI10", "VSTD5", "RSQR60", "CORR60", "WVMA60", "STD5", 
                            "RSQR20", "CORD60", "CORD10", "CORR20", "KLOW"
                        ]
        # Z-Score 标准化
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true # 裁剪异常值
        # 填充缺失值
        - class: Fillna
          kwargs:
              fields_group: feature
    # 学习阶段的数据处理器
    learn_processors:
        # 丢弃标签为空的数据
        - class: DropnaLabel
        # 截面排序归一化
        - class: CSRankNorm
          kwargs:
              fields_group: label
    # 标签定义：未来1天的收益率
    label: ["Ref($close, -2) / Ref($close, -1) - 1"] 

# 投资组合分析配置
port_analysis_config: &port_analysis_config
    # 策略配置
    strategy:
        # Top-K Dropout 策略
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>  # 使用模型预测值作为信号
            topk: 50  # 选取 top 50 的股票
            n_drop: 5 # 每轮丢弃 5 只股票
    # 回测配置
    backtest:
        start_time: 2017-01-01
        end_time: 2020-08-01
        account: 100000000  # 初始资金
        benchmark: *benchmark # 回测基准
        exchange_kwargs:
            limit_threshold: 0.095 # 涨跌停限制
            deal_price: close # 成交价为收盘价
            open_cost: 0.0005 # 开仓手续费
            close_cost: 0.0015 # 平仓手续费
            min_cost: 5 # 最低手续费
# 任务配置
task:
    # 模型配置
    model:
        # LightGBM 模型
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse # 损失函数
            colsample_bytree: 0.8879 # 特征采样率
            learning_rate: 0.2 # 学习率
            subsample: 0.8789 # 样本采样率
            lambda_l1: 205.6999 # L1 正则化
            lambda_l2: 580.9768 # L2 正则化
            max_depth: 8 # 最大深度
            num_leaves: 210 # 叶子节点数
            num_threads: 20 # 线程数
    # 数据集配置
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            # 数据处理器
            handler:
                # 使用 Alpha158 因子库
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            # 数据集划分
            segments:
                train: [2008-01-01, 2014-12-31] # 训练集
                valid: [2015-01-01, 2016-12-31] # 验证集
                test: [2017-01-01, 2020-08-01] # 测试集
    # 记录器配置，用于记录实验结果
    record: 
        # 记录模型预测信号
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        # 记录信号分析结果
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False # 是否分析多空组合
            ann_scaler: 252 # 年化因子
        # 记录投资组合分析结果
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
