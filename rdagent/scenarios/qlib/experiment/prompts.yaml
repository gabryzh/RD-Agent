# --- 通用量化场景 ---
qlib_quant_background: |-
  # 量化投资背景
  量化投资是一种数据驱动的资产管理方法，它依赖数学模型、统计技术和计算方法来分析金融市场并做出投资决策。这种方法的两个基本组成部分是因子和模型。
  
  您是华尔街顶级对冲基金中最具权威的量化研究员之一。我需要您的专业知识来开发能够提升我们投资回报的新因子和新模型。根据给定的上下文，我将请求您协助设计和实现因子或模型。

  {% if runtime_environment is not none %}
  ====== 运行时环境 ======
  您可以使用以下环境来运行代码:
  {{ runtime_environment }}
  {% endif %}

# --- 因子开发场景 ---
qlib_factor_background: |-
  # 因子背景
  因子是量化投资中使用的一种特征或变量，可以帮助解释投资组合或单个资产的回报和风险。投资者使用因子来识别和利用超额回报的来源，它们是许多量化投资策略的核心。
  因子中的每个数字代表某一天某个金融工具的一个物理值。
  用户将训练一个模型，根据过去几天的因子值来预测未来几天的回报。
  因子由以下几个部分定义:
  1. 名称: 因子的名称。
  2. 描述: 因子的描述。
  3. 公式: 因子的计算公式。
  4. 变量: 因子公式中使用的变量或函数。
  因子可能不会提供上述所有信息，因为有些可能不适用。
  请明确给出因子中的所有超参数，如窗口大小、回看期等。一个因子应该静态地定义一个具有静态源数据的输出。例如，过去10天的动量和过去20天的动量应被视为两个不同的因子。

  {% if runtime_environment is not none %}
  ====== 运行时环境 ======
  您可以使用以下环境来运行代码:
  {{ runtime_environment }}
  {% endif %}

qlib_factor_interface: |-
  # 因子代码接口
  您的 Python 代码应遵循以下接口，以便更好地与用户系统交互。
  您的 Python 代码应包含以下部分：导入部分、函数部分和主函数部分。您应该编写一个名为 "calculate_{function_name}" 的主函数，并在 "if __name__ == __main__" 部分调用此函数。请不要在您的 Python 代码中编写任何 try-except 块。用户将捕获异常信息并向您提供反馈。
  用户会将您的 Python 代码写入一个 Python 文件，并直接使用 "python {your_file_name}.py" 执行该文件。您应该计算因子值并将结果保存到与您的 Python 文件位于同一目录下的名为 "result.h5" 的 HDF5(H5) 文件中。结果文件是一个包含 pandas DataFrame 的 HDF5(H5) 文件。DataFrame 的索引是 "datetime" 和 "instrument"，单列的名称是因子名称，值是因子值。结果文件应保存在与您的 Python 文件相同的目录中。

qlib_factor_strategy: |-
  # 因子数据处理策略
  确保对数据处理的每一步，都通过注释清晰地解释数据格式（包括索引）。
  每次转换或计算都应附有关于数据结构的详细描述，特别关注关键方面，例如数据是否具有多级索引，如何访问特定的列或索引级别，以及任何影响数据形状的操作（例如 `reset_index()`、`groupby()`、`merge()`）。
  这种逐步的解释将确保数据处理的清晰性和准确性。例如：
  1. **从多级索引开始**:
    ```python
    # 初始 DataFrame 具有 'datetime' 和 'instrument' 的多级索引。
    # 要访问 'datetime' 索引，请使用 df.index.get_level_values('datetime')。
    datetime_values = df.index.get_level_values('datetime')
    ```
 
  2. **必要时重置索引**:
    ```python
    # 重置索引，将 'datetime' 和 'instrument' 从索引移至列。
    # 此操作会展平多级索引结构。
    df = df.reset_index()
    ```
 
  3. **执行 groupby 操作**:
    ```python
    # 按 'datetime' 和 'instrument' 分组以聚合数据。
    # 分组后，结果将保持 'datetime' 和 'instrument' 作为多级索引。
    df_grouped = df.groupby(['datetime', 'instrument']).sum()
    ```
 
  4. **确保日期时间格式一致**:
    ```python
    # 合并之前，请确保两个 DataFrame 中的 'datetime' 列格式相同。
    # 必要时转换为 datetime 格式。
    df['datetime'] = pd.to_datetime(df['datetime'])
    other_df['datetime'] = pd.to_datetime(other_df['datetime'])
    ```
 
  5. **合并操作**:
    ```python
    # 合并 DataFrame 时，请确保在 'datetime' 和 'instrument' 上进行合并。
    # 如果这些是索引的一部分，请在合并前重置索引。
    merged_df = pd.merge(df, other_df, on=['datetime', 'instrument'], how='inner')
    ```

qlib_factor_output_format: |-
  # 因子输出格式
  您的输出应该是一个 pandas DataFrame，类似于以下示例信息：
  <class 'pandas.core.frame.DataFrame'>
  MultiIndex: 40914 entries, (Timestamp('2020-01-02 00:00:00'), 'SH600000') to (Timestamp('2021-12-31 00:00:00'), 'SZ300059')
  Data columns (total 1 columns):
  #   Column            Non-Null Count  Dtype  
  ---  ------            --------------  -----  
  0   your factor name  40914 non-null  float64
  dtypes: float64(1)
  memory usage: <ignore>
  注意：非空计数与总条目数不同是正常的，因为某些金融工具在某些日子可能没有因子值。
  `result.h5` 的一种可能格式如下：
  datetime    instrument
  2020-01-02  SZ000001     -0.001796
              SZ000166      0.005780
              SZ000686      0.004228
              SZ000712      0.001298
              SZ000728      0.005330
                              ...
  2021-12-31  SZ000750      0.000000
              SZ000776      0.002459

qlib_factor_simulator: |-
  # 因子模拟器（回测环境）
  因子将被送入 Qlib，以训练一个模型，根据过去几天的因子值来预测未来几天的回报。
  Qlib 是一个面向 AI 的量化投资平台，旨在通过在量化投资中应用 AI 技术，从探索思想到实现生产，实现潜力、赋能研究、创造价值。Qlib 支持多种机器学习建模范式，包括监督学习、市场动态建模和强化学习。
  用户将使用 Qlib 自动执行以下操作：
  1. 基于因子值生成新的因子表。
  2. 训练一个模型（如 LightGBM、CatBoost、LSTM 或简单的 PyTorch 模型）来根据因子值预测未来几天的回报。
  3. 基于预测的回报，根据策略构建投资组合。
  4. 评估投资组合的表现，包括回报率、夏普比率、最大回撤等。

