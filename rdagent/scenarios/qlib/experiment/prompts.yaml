# --- 模型开发场景 ---
qlib_model_background: |-
  # 模型背景
  模型是量化投资中使用的机器学习或深度学习结构，用于预测投资组合或单个资产的回报和风险。投资者使用模型根据历史数据和已识别的因子生成预测，这些是许多量化投资策略的核心。
  每个模型都以因子为输入，并预测未来的回报。通常，模型越大，性能越好。
  模型由以下几个部分定义:
  1. 名称: 模型的名称。
  2. 描述: 模型的描述。
  3. 架构: 模型的详细架构，例如神经网络层或树结构。
  4. 超参数: 模型中使用的超参数。
  5. 训练超参数: 训练过程中使用的超参数。
  6. 模型类型: 模型的类型，"Tabular" 表示表格模型，"TimeSeries" 表示时间序列模型。
  模型应提供其架构和超参数的清晰详细的文档。一个模型应静态地定义一个具有固定架构和超参数的输出。

  {% if runtime_environment is not none %}
  ====== 运行时环境 ======
  您可以使用以下环境来运行代码:
  {{ runtime_environment }}
  {% endif %}

qlib_model_interface: |-
  # 模型代码接口
  您的 Python 代码应遵循以下接口，以便更好地与用户系统交互。
  您的代码应包含几个部分：
  1. 导入部分：导入必要的库。
  2. 一个作为 pytorch.nn.Module 子类的类。该类应具有一个 init 函数和一个 forward 函数，该函数输入一个张量并输出一个张量。
  3. 将一个名为 "model_cls" 的变量设置为您定义的类。

  用户会将您的代码保存到一个名为 "model.py" 的 Python 文件中。然后，用户在将当前工作目录设置到该目录后，在 "model.py" 文件中导入 model_cls：
  ```python
  from model import model_cls
  ```
  因此，您的 Python 代码应遵循以下模式：
  ```python
  class XXXModel(torch.nn.Module):
      ...
  model_cls = XXXModel
  ```

  模型可以配置为 "Tabular"（表格模型）或 "TimeSeries"（时间序列模型）。对于表格模型，输入形状为 (batch_size, num_features)，而对于时间序列模型，输入形状为 (batch_size, num_timesteps, num_features)。在这两种情况下，模型的输出形状都应为 (batch_size, 1)。
  `num_features` 将根据输入数据形状直接为模型设置。
  用户将使用以下代码初始化表格模型：
  ```python
  model = model_cls(num_features=num_features)
  ```
  用户将使用以下代码初始化时间序列模型：
  ```python
  model = model_cls(num_features=num_features, num_timesteps=num_timesteps)
  ```
  不会有其他参数传递给模型，因此请为其他参数提供默认值或使其保持静态。

  请不要在您的 Python 代码中编写任何 try-except 块。用户将捕获异常信息并向您提供反馈。另外，请不要在您的 Python 代码中编写 main 函数。用户将调用 model_cls 中的 forward 方法来获取输出张量。

  请注意，您的模型应仅使用当前特征作为输入。用户将向模型的 forward 函数提供输入张量。


qlib_model_output_format: |-
  # 模型输出格式
  您的输出应该是一个形状为 (batch_size, 1) 的张量。
  输出张量应保存在与您的 Python 文件位于同一目录下的名为 "output.pth" 的文件中。
  用户将评估输出张量的形状，因此从 "output.pth" 读取的张量应为 8 个数字。

qlib_model_simulator: |-
  # 模型模拟器（回测环境）
  模型将被送入 Qlib 进行训练和评估，以预测未来回报的性能。在检查结果反馈后，假设会得到改进。
  Qlib 是一个面向 AI 的量化投资平台，旨在通过在量化投资中应用 AI 技术，从探索思想到实现生产，实现潜力、赋能研究、创造价值。Qlib 支持多种机器学习建模范式，包括监督学习、市场动态建模和强化学习（RL）。
  用户将使用 Qlib 自动执行以下任务：
  1. 生成基准因子表。
  2. 训练您在 Net 类中定义的模型，以根据因子值预测未来几天的回报。
  3. 使用特定策略，根据预测的回报构建投资组合。
  4. 评估投资组合的表现，包括回报率、IC、最大回撤等指标。
  5. 根据性能评估和反馈，迭代增长假设以实现模型改进。

