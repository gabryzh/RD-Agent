# --- 通用模板 ---
hypothesis_and_feedback: |-
  # 模板：历史假设与反馈
  =========================================================
  {% for experiment, feedback in trace.hist %}
  # 试验 {{ loop.index }}:
  ## 假设
  {{ experiment.hypothesis }}
  ## 具体任务:
  {% for task in experiment.sub_tasks %}
  {% if task is not none and task.get_task_brief_information is defined %}
  {{ task.get_task_brief_information() }}
  {% endif %}
  {% endfor %}
  ## 回测分析与反馈:
  {% if experiment.result is not none %}
  回测结果: {{ experiment.result.loc[["IC", "1day.excess_return_without_cost.annualized_return", "1day.excess_return_without_cost.max_drawdown"]] }}
  {% endif %}
  观察: {{ feedback.observations }}
  假设评估: {{ feedback.hypothesis_evaluation }}
  决策 (假设是否成功): {{ feedback.decision }}
  =========================================================
  {% endfor %}

last_hypothesis_and_feedback: |-
  # 模板：最近一次的假设与反馈
  ## 假设
  {{ experiment.hypothesis }}
  ## 具体任务:
  {% for task in experiment.sub_tasks %}
  {% if task is not none and task.get_task_brief_information is defined %}
  {{ task.get_task_brief_information() }}
  {% endif %}
  {% endfor %}
  ## 回测分析与反馈:
  {% if experiment.result is not none %}
  回测结果: {{ experiment.result.loc[["IC", "1day.excess_return_without_cost.annualized_return", "1day.excess_return_without_cost.max_drawdown"]] }}
  {% endif %}
  训练日志:
  在这里，你需要专注于分析训练过程中是否存在任何问题。如果发现任何问题，你必须在下一次迭代中纠正它们，并在假设中清楚地描述将如何进行更改。
  {{ experiment.stdout }} 
  观察: {{ feedback.observations }}
  评估: {{ feedback.hypothesis_evaluation }}
  决策 (本次实验是否成为 SOTA): {{ feedback.decision }}
  新假设 (在反馈阶段给出，仅供参考，可在下一轮中接受或拒绝): {{ feedback.new_hypothesis }}
  推理 (新假设的理由): {{ feedback.reason }}

sota_hypothesis_and_feedback: |-
  # 模板：SOTA（当前最佳）的假设与反馈
  ## 假设
  {{ experiment.hypothesis }}
  ## 具体任务:
  {% for task in experiment.sub_tasks %}
  {% if task is not none and task.get_task_brief_information is defined %}
  {{ task.get_task_brief_information() }}
  {% endif %}
  {% endfor %}
  ## 回测分析与反馈:
  {% if experiment.result is not none %}
  回测结果: {{ experiment.result.loc[["IC", "1day.excess_return_without_cost.annualized_return", "1day.excess_return_without_cost.max_drawdown"]] }}
  {% endif %}
  训练日志: {{ experiment.stdout }}
  观察: {{ feedback.observations }}
  评估: {{ feedback.hypothesis_evaluation }}
  决策 (本次实验是否成为 SOTA): {{ feedback.decision }}

# --- 假设生成的输出格式 ---
hypothesis_output_format: |-
  # 模板：通用假设输出格式
  输出应遵循 JSON 格式。结构如下：
  {
  "hypothesis": "一个精确、可检验且创新的陈述，源自对先前实验追踪的分析。避免过于笼统的想法，并确保精确性。假设应在两到三句话中清楚地说明具体方法和预期的性能改进。",
  "reason": "为提出该假设提供清晰、合乎逻辑的解释，并以证据（例如，追踪历史、领域原则）为基础。理由应简短，不超过两句话。",
  }

factor_hypothesis_output_format: |-
  # 模板：因子假设输出格式
  输出应遵循 JSON 格式。结构如下：
  {
  "hypothesis": "根据所提供信息生成的新假设。限制在两到三句话内。",
  "reason": "你生成此假设的原因。它应全面且合乎逻辑。它应涵盖下面的其他键并进行扩展。限制在两到三句话内。",
  }

hypothesis_output_format_with_action: |-
  # 模板：带动作选择的假设输出格式
  输出应遵循 JSON 格式。结构如下：
  {
  "action": "如果 `hypothesis_specification` 提供了你需要采取的行动，请遵循 `hypothesis_specification` 来选择行动。否则，根据以前的实验结果，建议你认为目前最合适的行动。它应该是 [`factor`, `model`] 中的一个。",
  "hypothesis": "根据所提供信息生成的新假设，应为字符串。",
  "reason": "你生成此假设的原因。它应全面且合乎逻辑。它应涵盖下面的其他键并进行扩展。限制在两到三句话内。",
  }

# --- 假设生成的规范/指南 ---
model_hypothesis_specification: |-
  # 指南：模型假设的规范
  1. 首先，观察并分析 `hypothesis_and_feedback` 中的整体实验进展。分析以前的模型设计在哪些方面存在不足——是由于参数设置、架构缺陷，还是缺乏新颖性（只要能证明有效性，非常鼓励提出全新的概念）。
  2. 其次，`last_hypothesis_and_feedback` 和 `sota_hypothesis_and_feedback` 是你应该密切关注的关键参考。你可以选择基于其中任何一个进行优化，或者产生新的想法来形成假设和实验。
  3. 如果开始时没有可用的先前实验或结果，可以从实现一个简单且小型的架构开始。
  4. 如果一系列尝试未能达到 SOTA，考虑探索全新的方向；此时，可以接受回到简单的架构。
  5. 只关注 PyTorch 模型的架构。每个假设都应具体解决架构决策，例如层配置、激活函数、正则化方法和整体模型结构。不要进行任何特定于特征的处理。相反，你可以提出对输入时间序列数据的创新转换，以增强模型训练效果。
  6. 避免包含与架构无关的方面，例如输入特征或优化策略。
  7. 有时，当训练性能较差时，调整超参数也是一种有效的改进策略。
  8. 使用标准库作为基线模型，但也要探索自定义架构设计以研究新颖的结构。在对传统模型进行足够多的试验后，力求在时间序列建模方面达到顶级 AI 会议（NeurIPS、ICLR、ICML、SIGKDD 等）水平的创新。

factor_hypothesis_specification: |-
  # 指南：因子假设的规范
  1. **每次生成1-5个因子：**
    - 确保每次生成产出1-5个因子。
    - 平衡简单性与复杂性，以构建一个稳健的因子库。
    - 充分利用提供给你的金融数据，而不仅仅是专注于某个特定领域。
  2. **先从简单有效的因子开始：**
    - 从简单、易于实现且可能有效的因子开始。
    - 简洁地解释为什么这些因子预计会起作用。
    - 最初避免使用复杂或组合的因子。
  3. **逐步增加复杂性：**
    - 随着收集到更多的实验结果，引入更复杂的因子（例如基于机器学习的因子、使用多维因子原始数据的因子等）。
    - 只有在测试和验证了较简单的因子之后，才组合因子。
  4. **新方向与优化：**
    - 如果连续多次迭代未能产生超过 SOTA 的因子，考虑转换到新的方向，并可以再次从简单的因子开始。
    - 如果优化特定类型的因子，则从简单到复杂进行。
  5. **注意：**
    - 强调超过 SOTA 的因子已包含在库中，以避免重复实现。
    - 无论你计划生成多少个因子，只回复一组假设和理由。假设可以同时包含多个因子的提议。

# --- 实验生成的输出格式 ---
factor_experiment_output_format: |-
  # 模板：因子实验输出格式
  输出应遵循 JSON 格式。结构如下：
  {
      "因子名称1": {
          "description": "因子1的描述，以其类型开头，例如 [动量因子]",
          "formulation": "因子1的 latex 公式",
          "variables": {
              "变量或函数名1": "变量或函数1的描述",
              "变量或函数名2": "变量或函数2的描述"
          }
      },
      "因子名称2": {
          "description": "因子2的描述，以其类型开头，例如 [基于机器学习的因子]",
          "formulation": "因子2的 latex 公式",
          "variables": {
              "变量或函数名1": "变量或函数1的描述",
              "变量或函数名2": "变量或函数2的描述"
          }
      }
      # 不要在这里添加省略号 (...) 或任何可能导致 JSON 解析错误的填充文本！
  }

model_experiment_output_format: |-
  # 模板：模型实验输出格式
  到目前为止，请只设计一个模型来测试假设！
  输出应遵循 JSON 格式。结构如下（training_hyperparameters 中的值是供参考的基本设置，你可以根据以前的训练日志进行更改）：
  {
    "模型名称": {
        "description": "模型的详细描述",
        "formulation": "表示模型公式的 LaTeX 公式",
        "architecture": "模型架构的详细描述，例如神经网络层或树结构",
        "variables": {
            "\\hat{y}_u": "节点 u 的预测输出",
            "变量名2": "变量2的描述",
            "变量名3": "变量3的描述"
        },
        "hyperparameters": {
            "超参数名1": "超参数1的值",
            "超参数名2": "超参数2的值",
            "超参数名3": "超参数3的值"
        },
        "training_hyperparameters" {  # 所有值仅供参考；你可以自行设置
            "n_epochs": "100",
            "lr": "1e-3",
            "early_stop": 10,
            "batch_size": 256,
            "weight_decay": 1e-4,
        }
        "model_type": "Tabular or TimeSeries"  # 应为 "Tabular" 或 "TimeSeries" 之一
    },
  }

# --- 反馈生成 ---
factor_feedback_generation:
  # 系统提示：生成因子实验的反馈
  system: |-
    你是一位数据驱动研发领域的专业金融结果分析助手。
    任务在以下场景中描述：

    {{ scenario }}
    
    你将收到一个假设、多个任务及其因子、它们的结果以及 SOTA 结果。
    你的反馈应说明当前结果是支持还是反驳该假设，将其与以前的 SOTA（State of the Art）结果进行比较，并提出改进或新方向的建议。
    
    请理解以下操作逻辑，然后做出适合该场景的反馈：
      1. 逻辑解释：
        a) 以前尝试中所有超过 SOTA 的因子都将包含在 SOTA 因子库中。
        b) 新的实验将生成新的因子，这些因子将与 SOTA 库中的因子相结合。
        c) 这些组合因子将进行回测，并与当前的 SOTA 进行比较，以实现持续迭代。
      2. 发展方向：
        a) 新方向：提出一个新的因子方向进行探索和发展。
        b) 优化现有方向：
          - 建议对该因子进行进一步改进（这可以包括对因子的进一步优化或提出与该因子更好结合的方向）。
          - 避免重新实现以前的因子，因为那些超过 SOTA 的因子已经包含在因子库中，并将在每次运行中使用。
      3. 最终目标：持续积累超过每次迭代的因子，以保持最佳的 SOTA。
    
    在判断结果时：
      1. 任何微小的改进都应被考虑纳入 SOTA（将 `Replace Best Result` 设置为 yes）。
      2. 如果新因子在年化回报率上显示出改进，则建议用它替换当前的最佳结果。
      3. 只要年化回报率有所改善，其他指标的微小变化是可以接受的。

    当与 SOTA 存在显著差距时，考虑改变方向：
      - 如果新结果与 SOTA 显著不同，考虑探索一个新的方向（编写新型因子）。
      - 避免重新实现以前的因子，因为那些超过 SOTA 的因子已经包含在因子库中，并将在每次运行中使用。

    请为未来的探索提供详细且建设性的反馈。
    以 JSON 格式响应。结果分析的示例 JSON 结构：
    {
      "Observations": "你在此处的总体观察",
      "Feedback for Hypothesis": "与假设相关的观察",
      "New Hypothesis": "你在此处的新假设",
      "Reasoning": "新假设的推理",
      "Replace Best Result": "yes 或 no"
    }
  # 用户提示：提供生成因子反馈所需的信息
  user: |-
    目标假设:
    {{ hypothesis_text }}
    任务和因子:
    {% for task in task_details %}
      - {{ task.factor_name }}: {{ task.factor_description }}
        - 因子公式: {{ task.factor_formulation }}
        - 变量: {{ task.variables }}
        - 因子实现情况: {{ task.factor_implementation }}
        {% if task.factor_implementation == "False" %}
        **注意：此因子在当前实验中未实现。只有已实现因子的假设才能被验证。**
        {% endif %}
    {% endfor %}
    组合结果:
    {{ combined_result }}
    
    在以下背景下分析组合结果的能力：
    1. 支持或反驳假设。
    2. 与 SOTA 实验相比显示出改进或恶化。
    
    注意：只有‘因子实现情况’为 True 的因子才在此实验中实现和测试。如果‘因子实现情况’为 False，则该因子的假设无法在本次运行中验证。

model_feedback_generation:
  # 系统提示：生成模型实验的反馈
  system: |-
    你是一家顶级对冲基金的专业量化分析助手。

    任务在以下场景中描述：
    {{ scenario }}

    你将收到一个量化模型假设、其具体的任务描述以及市场回测结果。
    你的反馈应说明当前结果是支持还是反驳该假设，将其与以前的 SOTA 结果进行比较，检查模型的训练日志以分析超参数设置是否存在问题，并提出改进或新方向的建议。

    请提供详细且建设性的反馈。
    结果分析的示例 JSON 结构：
    {
      "Observations": "首先分析模型的训练日志，以确定其参数设置是否存在任何问题。然后用确切的分数和任何显著的模式清楚地总结当前结果和 SOTA 结果。将你的摘要限制在不超过三个简洁、以数据为中心的句子。",
      "Feedback for Hypothesis": "基于具体的数据点或性能趋势，明确确认或反驳该假设。限制在两句话内。",
      "New Hypothesis": "提出一个修订后的假设，考虑当前假设中观察到的模式和局限性。限制在不超过两句话。",
      "Reasoning": "使用具体的趋势或性能变化来解释新假设的理由。要简洁但技术上完整。限制在两句话内。",
      "Decision": <true or false>,
    }

  # 用户提示：提供生成模型反馈所需的信息
  user: |-
    {% if sota_hypothesis %} 
    # SOTA 回合信息:
    假设: {{ sota_hypothesis.hypothesis }}
    具体任务: {{ sota_task }}
    代码实现: {{ sota_code }}
    结果: {{ sota_result }}
    {% else %}
    # 这是第一轮。没有可用的先前信息。只要性能不是太负（例如 ICIR 大于0），就将其视为成功。不要将阈值设置得太高。
    {% endif %} 
    
    # 当前回合信息:
    假设: {{ hypothesis.hypothesis }}
    提出此假设的原因: {{ hypothesis.reason }}
    具体任务: {{ exp.sub_tasks[0].get_task_information() }}
    代码实现: {{ exp.sub_workspace_list[0].file_dict.get("model.py") }}
    训练日志: {{ exp.stdout }}
    结果: {{ exp_result }}

    # 判断结果时：
    1. **替换建议：**
      - 如果新模型的性能在年化回报率上有所改善，建议用它替换当前的 SOTA 结果。
      - 只要年化回报率有所改善，其他指标的微小变化是可以接受的。
    2.  当结果明显差于 SOTA 时考虑改变方向：
      - 如果新结果明显差于 SOTA，考虑探索一个新的方向，比如改变模型架构。

# --- 动作选择 ---
action_gen:
  # 系统提示：选择下一个动作（因子或模型）
  system: |-
    量化投资是一种数据驱动的资产管理方法，它依赖数学模型、统计技术和计算方法来分析金融市场并做出投资决策。这种方法的两个基本组成部分是因子和模型。
  
    您是华尔街顶级对冲基金中最具权威的量化研究员之一。我需要您的专业知识来开发能够提升我们投资回报的新因子和新模型。根据给定的上下文，我将请求您协助设计和实现因子或模型。

    你将收到一系列实验，包括它们的因子和模型，以及它们的结果。
    你的任务是分析以前的实验，并决定下一个实验应该侧重于因子还是模型。

    你的返回示例 JSON 结构：
    {
      "action": "factor" 或 "model",  # 你必须选择两者之一
    }

  # 用户提示：提供动作选择所需的信息
  user: |-
    {% if hypothesis_and_feedback|length == 0 %}
    这是假设生成的第一轮。用户在此场景下还没有任何假设。
    {% else %}
    以前的假设和相应的反馈如下：
    {{ hypothesis_and_feedback }}
    {% endif %}

  
    {% if last_hypothesis_and_feedback != "" %}
    这是上一次试验的假设和相应的反馈。主要反馈包括一个仅供你参考的新假设。你应该评估整个推理链，以决定是采纳它，还是提出一个更合适的假设，或者将其转移并优化到另一个场景（例如，因子/模型），因为通常鼓励转移：
    {{ last_hypothesis_and_feedback }}
    {% endif %}
