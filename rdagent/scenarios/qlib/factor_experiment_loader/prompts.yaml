# --- 因子提取相关提示 ---
extract_factors_system: |-
    # 系统提示：提取因子和模型
    用户会提供一篇金融工程研报，其中包括了量化因子和模型研究，请按照要求抽取以下信息:
    1. 概述这篇研报的主要研究思路;
    2. 抽取出所有的因子，并概述因子的计算过程，请注意有些因子可能存在于表格中，请不要遗漏，因子的名称请使用英文，不能包含空格，可用下划线连接，研报中可能不含有因子，若没有请返回空字典;
    3. 抽取研报里面的所有模型，并概述模型的计算过程，可以分步骤描述模型搭建或计算的过程，研报中可能不含有模型，若没有请返回空字典;

    用户会将您的因子名称作为键来存储因子，请不要在内容中包含任何交互性信息。只需响应输出，无需任何交互和解释。
    所有名称都应为英文。
    请以 JSON 格式响应您的分析。JSON 结构应包括：
    {
        "summary": "本报告的摘要",
        "factors": {
            "因子1的名称": "因子1的描述",
            "因子2的名称": "因子2的描述"
        },
        "models": {
            "模型1的名称": "模型1的描述",
            "模型2的名称": "模型2的描述"
        }
    }

extract_factors_follow_user: |-
    # 用户提示：继续提取因子（用于多轮对话）
    请继续提取因子。请忽略前面消息中已出现的因子。如果未找到因子，请返回一个空字典。
    注意：您不应错过报告中的任何一个因子！有些因子可能会在报告中多次出现。您可以重复它们以避免遗漏其他因子。
    请以 JSON 格式响应您的分析。JSON 结构应包括：
    {
        "factors": {
            "因子1的名称": "因子1的描述",
            "因子2的名称": "因子2的描述"
        }
    }

extract_factor_formulation_system: |-
    # 系统提示：提取因子公式
    我有一份金融工程研究报告和从中提取的因子列表。我需要帮助，根据报告和提供的因子列表提取特定信息。任务如下：

    1. 对于每个因子，我需要其 LaTeX 格式的计算公式。公式中的变量名不应包含空格；请使用下划线连接单词。请确保公式中的因子名称与我提供的名称一致。
    2. 对于每个因子公式，请提供所用变量和函数的解释。解释应为英文，变量和函数名称应与公式中使用的名称匹配。

    我拥有的数据源如下：

    1. 股票交易数据表：包含股票交易信息，如每日开盘价、收盘价、最高价、最低价、VWAP 价格、成交量和换手率。
    2. 财务数据表：包含公司财务报表，如资产负债表、利润表和现金流量表。
    3. 股票基本数据表：包含股票的基本信息，如总股本、自由流通股、行业分类、市场分类等。
    4. 高频数据：包含每只股票的分钟级价格和成交量，包括开盘价、收盘价、最高价、最低价、成交量和 VWAP。

    请展开公式以使用我提供的数据源。如果因子数量超过 token 限制，请在不超过限制的情况下为尽可能多的因子提取公式。请确保避免 JSON 中与特殊字符（尤其是 LaTeX 中的反斜杠和下划线）相关的语法错误。

    请以 JSON 格式提供您的分析，使用以下结构：
    {
        "因子名称1": {
            "formulation": "因子1的 latex 公式",
            "variables": {
                "变量或函数名1": "变量或函数1的描述",
                "变量或函数名2": "变量或函数2的描述"
            }
        },
        "因子名称2": {
            "formulation": "因子2的 latex 公式",
            "variables": {
                "变量或函数名1": "变量或函数1的描述",
                "变量或函数名2": "变量或函数2的描述"
            }
        }
    }

extract_factor_formulation_user: |-
    # 用户提示：提取因子公式（提供报告内容和因子列表）
    ===========================报告内容:=============================
    {{ report_content }}
    ===========================DataFrame格式的因子列表=============================
    {{ factor_dict }}

# --- 报告分类相关提示 ---
classify_system_chinese: |-
    # 系统提示：研报分类（中文版）
    你是一个研报分类助手。用户会输入一篇金融研报。请按照要求回答：
    因子指能够解释资产收益率或价格等的变量；而模型则指机器学习或深度学习模型，利用因子等变量来预测价格或收益率变化。

    请你对研报进行分类，考虑两个条件：
        1. 是金工量化领域中选股（需与择时，选基等严格区分开）方面的研报;
        2. 涉及了因子或模型的构成，或者是测试了它们的表现。
    如果研报同时满足上述两个条件，请输出1；若没有，请输出0。

    请使用json进行回答。json key为：class

classify_system: |-
    # 系统提示：研报分类（英文版）
    你的工作是分类用户输入的文档是否为量化投资研究报告。用户将输入一个文档，你应该根据以下条件对其进行分类：
    1. 文档是关于金融的，而不是其他领域，如生物、物理、化学等。
    2. 文档是关于金属加工量化领域的选股研究报告（需要与择时和基金选择严格区分）。
    3. 文档涉及因子或模型的构成，或测试了它们的性能。

    如果文档满足上述所有条件，请返回1；否则，请返回0。

    请以 JSON 格式响应您的决定。只需响应输出的 json 字符串，无需任何交互和解释。
    JSON 结构应包括：
    {
        "class": 1
    }

# --- 因子可行性与相关性检查提示 ---
factor_viability_system: |-
    # 系统提示：检查因子可行性
    用户在量化投资中设计了几个因子。请帮助用户检查这些因子的可行性。
    这些因子用于在中国 A 股市场建立日频策略。

    用户将提供一个类似 pandas DataFrame 的表格，其中包含以下信息：
    1. 因子名称；
    2. 因子的简单描述；
    3. 因子的 LaTeX 格式公式；
    4. 因子公式中变量和函数的描述。

    用户有以下几个数据源：
    1. 股票交易数据表，包含股票交易信息，如每日开盘价、收盘价、最高价、最低价、vwap 价格、成交量和换手率；
    2. 财务数据表，包含公司财务报表，如资产负债表、利润表和现金流量表；
    3. 股票基本数据表，包含股票的基本信息，如总股本、自由流通股、行业分类、市场分类等；
    4. 高频数据，包含每只股票每分钟的开盘价、收盘价、最高价、最低价、成交量、vwap；
    5. 一致性预期因子，包含分析师对公司未来业绩的一致性预期。

    一个可行的因子应满足以下条件：
    1. 因子能够以日频计算；
    2. 因子能够基于每只股票进行计算；
    3. 因子能够基于用户提供的数据源进行计算。

    你应该对用户提供的每个因子给出决定。你应该基于非常可靠的理由拒绝因子。
    请对可行的因子返回 true，对不可行的因子返回 false。

    注意，由于 token 限制，你可能只能返回部分因子。你的因子名称应与用户的因子名称相同。

    请以 JSON 格式响应您的决定。只需响应输出的 json 字符串，无需任何交互和解释。
    JSON 结构应包括：
    {
        "因子1的名称":
        {
            "viability": true,
            "reason": "该因子可行性的原因"
        },
        "因子2的名称":
        {
            "viability": false,
            "reason": "该因子不可行性的原因"
        },
        "因子3的名称":
        {
            "viability": true,
            "reason": "该因子可行性的原因"
        }
    }

factor_relevance_system: |-
    # 系统提示：检查因子相关性
    用户在量化投资中设计了几个因子。请帮助用户检查这些因子是否与真正的量化投资因子相关。
    这些因子用于在中国 A 股市场建立日频策略。

    用户将提供一个类似 pandas DataFrame 的表格，其中包含以下信息：
    1. 因子名称；
    2. 因子的简单描述；
    3. 因子的 LaTeX 格式公式；
    4. 因子公式中变量和函数的描述。

    一个相关的因子应满足以下条件：
    1. 因子能够以日频计算；
    2. 因子能够基于每只股票进行计算；
    3. 因子应仅基于数学操作计算，而不是基于主观判断或自然语言分析。

    你应该对用户提供的每个因子给出决定。你应该基于非常可靠的理由拒绝因子。
    请对相关的因子返回 true，对不相关的因子返回 false。

    注意，由于 token 限制，你可能只能返回部分因子。你的因子名称应与用户的因子名称相同。

    请以 JSON 格式响应您的决定。只需响应输出的 json 字符串，无需任何交互和解释。
    JSON 结构应包括：
    {
        "因子1的名称":
        {
            "relevance": true,
            "reason": "该因子相关性的原因"
        },
        "因子2的名称":
        {
            "relevance": false,
            "reason": "该因子不相关性的原因"
        },
        "因子3的名称":
        {
            "relevance": true,
            "reason": "该因子相关性的原因"
        }
    }


# --- 因子去重提示 ---
factor_duplicate_system: |-
    # 系统提示：因子去重
    用户在量化投资中设计了几个因子。请帮助用户对这些因子进行去重。
    这些因子用于在中国 A 股市场建立日频策略。

    用户将提供一个类似 pandas DataFrame 的表格，其中包含以下信息：
    1. 因子名称；
    2. 因子的简单描述；
    3. 因子的 LaTeX 格式公式；
    4. 因子公式中变量和函数的描述。

    用户希望找到是否存在重复的组。重复组中的因子应满足以下条件：
    1. 它们的名称、描述、公式或公式中变量和函数的描述可能不同，包括一些大小写差异；
    2. 它们应该讨论的是完全相同的因子；
    3. 如果提供了时间跨度信息，如1天、5天、10天等，则时间跨度信息应相同。

    为了使您的响应有效，我们有一些非常重要的约束需要您遵守！列在此处：
    1. 你应该非常有信心地将重复的因子放入一个组中；
    2. 一个组应至少包含两个因子；
    3. 对于没有重复的因子，不要将它们放入您的响应中；
    4. 为避免合并太多相似的因子，不要将超过十个因子放入一个组中！
    你应始终遵循上述约束以使您的响应有效。

    您的响应 JSON 结构应包括：
    [
        [
            "因子名称1",
            "因子名称2"
        ],
        [
            "因子名称5",
            "因子名称6"
        ],
        [
            "因子名称7",
            "因子名称8",
            "因子名称9"
        ]
    ]
    您的响应是一个列表的列表。每个列表代表一个重复组，包含该组中所有因子的名称。
    列表中的因子名称应是唯一的，且因子名称应与用户的因子名称相同。
    为避免达到 token 限制，一次响应中不要超过五十个组。您应响应输出的 json 字符串，无需任何交互和解释。
